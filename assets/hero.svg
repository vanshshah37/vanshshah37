<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="330">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="95%" stop-color="#ff6b4a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111116" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .tele-text { font-family: 'DM Mono', Consolas, monospace, sans-serif; font-size: 11px; fill: #94a3b8; letter-spacing: 0.5px; }
    .avail-text { font-family: 'DM Mono', Consolas, monospace, sans-serif; font-size: 11px; fill: #22c55e; font-weight: 600; letter-spacing: 0.5px; }
    .hero-name { font-family: 'Syne', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 50px; font-weight: 800; letter-spacing: 1.5px; fill: url(#nameGrad); }
    .hero-sub { font-family: 'DM Mono', Consolas, monospace, sans-serif; font-size: 13.5px; fill: #ff6b4a; font-weight: 600; letter-spacing: 1.5px; }
    .hero-desc { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #94a3b8; line-height: 1.6; }
    .hero-highlight { fill: #f8fafc; font-weight: 600; }
    .tagline-anim { font-family: 'Outfit', 'DM Mono', sans-serif; font-size: 18px; font-weight: 600; fill: #ff6b4a; letter-spacing: 0.5px; }
    .cursor-bar { animation: blink 0.8s infinite; fill: #ff6b4a; }
  </style>

  <!-- Outer Card Frame with Subtle Rounded Border -->
  <rect x="1" y="1" width="848" height="328" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Name -->
  <circle cx="425" cy="115" r="100" fill="#ff6b4a" opacity="0.1" filter="url(#glow)" />

  <!-- Telemetry Bar Capsule -->
  <g transform="translate(38, 20)">
    <rect x="0" y="0" width="774" height="32" rx="16" fill="#0d0d12" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="22" y="20.5" class="tele-text">
      BASED IN AHMEDABAD, INDIA &#160;•&#160; B.TECH CSE · NIRMA UNIVERSITY &#160;•&#160; CGPA 8.7+
    </text>
    <circle cx="586" cy="16" r="3.5" fill="#22c55e" />
    <text x="598" y="20.5" class="avail-text">AVAILABLE FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Main Hero Name -->
  <text x="425" y="112" text-anchor="middle" class="hero-name">VANSH SHAH</text>

  <!-- Subtitle -->
  <text x="425" y="142" text-anchor="middle" class="hero-sub">// SOFTWARE ENGINEER &amp; HACKATHON BUILDER</text>

  <!-- Bio Lines -->
  <text x="425" y="180" text-anchor="middle" class="hero-desc">
    Building high-performance software end-to-end — from algorithmic optimization in <tspan class="hero-highlight">C++</tspan> and offline-first
  </text>
  <text x="425" y="202" text-anchor="middle" class="hero-desc">
    <tspan class="hero-highlight">Flutter</tspan> systems to full-stack web platforms in <tspan class="hero-highlight">React 19 &amp; Next.js</tspan>. Active Open Source Contributor to
  </text>
  <text x="425" y="224" text-anchor="middle" class="hero-desc">
    <tspan class="hero-highlight">Microsoft VS Code Docs</tspan>.
  </text>

  <!-- Animated Rotating Feature Headline -->
  <g transform="translate(425, 275)" text-anchor="middle">
    <text class="tagline-anim">
      <tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.85;0.95;1" dur="12s" repeatCount="indefinite" />
        ⚡ Odoo Hackathon Finalist
      </tspan>
      <tspan class="cursor-bar">|</tspan>
    </text>
  </g>
</svg>