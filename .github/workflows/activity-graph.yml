name: Generate Activity Graph

on:
  schedule:
    # Runs every 2 hours between 10:30 AM and 2:30 AM IST (skips sleep hours ~2 AM - 10 AM IST)
    - cron: "0 5-21/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Activity Graph SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_activity_graph.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-update activity graph [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
